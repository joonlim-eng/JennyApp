<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 15px;
        font-size: 14px;
      }
      .container {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      input[type="file"] {
        padding: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 8px 15px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        color: #333;
        word-break: break-all;
      }
      .error {
        color: red !important;
      }
      .success {
        color: green !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>엑셀 파일(.xlsx, .xls)을 선택해 주세요.</div>
      <input type="file" id="excelFile" accept=".xlsx, .xls" />
      <button id="uploadBtn" onclick="handleUpload()">업로드 및 변환</button>
      <div id="status"></div>
    </div>

    <script>
      function handleUpload() {
        var fileInput = document.getElementById('excelFile');
        var file = fileInput.files[0];
        var statusDiv = document.getElementById('status');
        var uploadBtn = document.getElementById('uploadBtn');

        if (!file) {
          statusDiv.className = 'error';
          statusDiv.innerText = '파일을 선택해 주세요.';
          return;
        }

        // 확장자 미리 확인
        if (!file.name.match(/\.(xlsx|xls)$/i)) {
          statusDiv.className = 'error';
          statusDiv.innerText = '엑셀 파일만 업로드할 수 있습니다.';
          return;
        }

        statusDiv.className = '';
        statusDiv.innerText = '처리 중입니다... 잠시만 기다려 주세요.';
        uploadBtn.disabled = true;

        var reader = new FileReader();
        reader.onload = function(e) {
          var fileData = {
            name: file.name,
            mimeType: file.type,
            content: e.target.result
          };

          // 서버 함수 호출
          google.script.run
            .withSuccessHandler(function(response) {
              if (response.success) {
                statusDiv.className = 'success';
                statusDiv.innerText = response.message;
                setTimeout(function() {
                  google.script.host.close();
                }, 1500);
              } else {
                statusDiv.className = 'error';
                statusDiv.innerText = '에러: ' + response.message;
                uploadBtn.disabled = false;
              }
            })
            .withFailureHandler(function(err) {
              statusDiv.className = 'error';
              statusDiv.innerText = '오류 발생: ' + err.message;
              uploadBtn.disabled = false;
            })
            .processExcelFile(fileData);
        };

        reader.readAsDataURL(file);
      }
    </script>
  </body>
</html>
